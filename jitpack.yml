# JitPack builds with Java 8 and an old Maven by default. MoonLib compiles against the Spigot 26.3 API,
# which is Java 25 bytecode, and its build plugins need Maven 3.6.3+. So this installs Temurin JDK 25
# (straight from Adoptium, so it works whatever JDKs JitPack ships) and Maven 3.9.9.
# The jar it produces is still Java 8 bytecode and runs on every supported server.
jdk:
  - openjdk21
before_install:
  - curl -fsSL -o /tmp/jdk25.tar.gz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
  - mkdir -p /tmp/jdk25 && tar -xzf /tmp/jdk25.tar.gz -C /tmp/jdk25 --strip-components=1
install:
  - export JAVA_HOME=/tmp/jdk25; export PATH=/tmp/jdk25/bin:$PATH; sdk install maven 3.9.9; sdk use maven 3.9.9; java -version; mvn -v; mvn -B clean install -DskipTests
