name: Docs

# Publishes the guides (MkDocs) and the Javadoc (under /api) to GitHub Pages.
# Enable Pages once: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'src/main/java/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Javadoc
        run: mvn -B -ntp -P release -DskipTests package

      - name: Build guides
        run: |
          pip install "mkdocs<2" mkdocs-material
          mkdocs build
          mkdir -p site/api
          cp -r target/apidocs/. site/api/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
