name: Docs

# Publishes the guides (MkDocs) and the Javadoc (under /api) to GitHub Pages.
# Enable Pages once: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'src/main/java/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Javadoc
        run: |
          mvn -B -ntp -P release -DskipTests package
          # Where the HTML lands depends on the javadoc plugin version (target/apidocs or
          # target/reports/apidocs), so look for it instead of assuming a path.
          API_INDEX=$(find target -type f -path '*apidocs/index.html' | head -n 1)
          if [ -z "$API_INDEX" ]; then
            mvn -B -ntp -P release -DskipTests javadoc:javadoc
            API_INDEX=$(find target -type f -path '*apidocs/index.html' | head -n 1)
          fi
          if [ -z "$API_INDEX" ]; then
            echo "::error::No Javadoc HTML found under target/"
            find target -maxdepth 3 -type d
            exit 1
          fi
          echo "Javadoc found in $(dirname "$API_INDEX")"
          mkdir -p docs/api
          cp -r "$(dirname "$API_INDEX")"/. docs/api/

      - name: Build guides
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: |
          pip install "mkdocs<2" mkdocs-material
          mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
