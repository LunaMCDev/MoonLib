name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [25]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Version is the same everywhere
        run: java tools/SetVersion.java --check

      - name: Build, test and install MoonLib
        run: mvn -B -ntp clean install

      - name: Javadoc (fails on missing or broken docs)
        run: mvn -B -ntp -P release -DskipTests package

      - name: Upload jars
        if: matrix.java == 25
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            target/moonlib-*.jar
          if-no-files-found: error
