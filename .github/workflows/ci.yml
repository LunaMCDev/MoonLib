name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, test and install MoonLib
        run: mvn -B -ntp clean install

      - name: Javadoc (fails on missing or broken docs)
        run: mvn -B -ntp -P release -DskipTests package

      - name: Example plugin
        run: mvn -B -ntp -f example-plugin/pom.xml package

      - name: Standalone plugin
        run: mvn -B -ntp -f standalone-plugin/pom.xml package

      - name: Template plugin (against this build)
        run: mvn -B -ntp -f template-plugin/pom.xml package -Dmoonlib.groupId=dev.lunamc -Dmoonlib.artifactId=moonlib

      - name: Template plugin dev build
        run: mvn -B -ntp -f template-plugin/pom.xml package -Pdev -Dmoonlib.groupId=dev.lunamc -Dmoonlib.artifactId=moonlib

      - name: Upload jars
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            target/moonlib-*.jar
            standalone-plugin/target/MoonLib-*.jar
            template-plugin/target/MoonTemplate-*.jar
          if-no-files-found: error
