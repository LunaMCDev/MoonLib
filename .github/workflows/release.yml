name: Release

# Push a tag such as 1.4.0 to build the jars and create a GitHub release with them.
# JitPack builds the same tag on demand for com.github.LunaMCDev:MoonLib:<tag>.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check the tag matches the version
        run: |
          VERSION=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pom.xml version $VERSION"; exit 1
          fi

      - name: Build
        run: |
          mvn -B -ntp -P release clean install
          mvn -B -ntp -f standalone-plugin/pom.xml package

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk "/^## \\[${GITHUB_REF_NAME}\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            target/moonlib-*.jar
            standalone-plugin/target/MoonLib-*.jar
