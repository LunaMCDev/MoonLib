name: ExamplePlugin
version: ${project.version}
main: com.example.exampleplugin.ExamplePlugin
# 1.13 is the lowest api-version value; servers older than 1.13 simply ignore this key,
# so the same jar still loads on 1.8.8 - 1.12.2.
api-version: '1.13'
# MoonLib's scheduler is Folia-aware; menus, commands and chat input work there too.
folia-supported: true
softdepend: [PlaceholderAPI, Vault]
description: Demonstrates every MoonLib feature.
author: LunaMCDev

# No commands section is needed: MoonLib registers commands directly into the command map.

permissions:
  example.admin:
    description: Access to /example admin commands.
    default: op
  example.heal:
    description: Use /heal.
    default: op
  example.heal.bypass:
    description: Skip the /heal cooldown.
    default: op
